services:
  postgres:
    image: postgres:16-alpine
    container_name: fugdb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fugdb_user
      POSTGRES_PASSWORD: fugdb_password
      POSTGRES_DB: fugdb_test
    ports:
      - "15432:5432"
    volumes:
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql/data

  mysql:
    image: mysql:8.0
    container_name: fugdb-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: fugdb_root_password
      MYSQL_DATABASE: fugdb_test
      MYSQL_USER: fugdb_user
      MYSQL_PASSWORD: fugdb_password
    ports:
      - "3306:3306"
    volumes:
      - ./docker/mysql-init:/docker-entrypoint-initdb.d
      - mysqldata:/var/lib/mysql

volumes:
  pgdata:
  mysqldata:
