[package]
name = "fugdb"
version = "0.1.0"
description = "Ultra-lightweight, high-performance cross-platform database client"
authors = ["Aditya Pratama <aditya@fugdb.dev>"]
edition = "2021"

[lib]
name = "fugdb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
async-trait = "0.1"
thiserror = "1.0"
anyhow = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Database Drivers
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "mysql",
    "sqlite",
    "chrono",
    "json",
    "uuid",
    "bigdecimal"
] }

# Security & Keyring & SSH Tunneling
keyring = "2.1"
ssh2 = "0.9"

# Data Mocking & ETL
fake = { version = "2.9", features = ["derive", "chrono"] }
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
csv-async = { version = "1.3", features = ["tokio"] }
calamine = "0.26"
tiberius = { version = "0.12", default-features = false, features = ["chrono", "rust_decimal", "tds73", "winauth", "rustls"] }
tokio-util = { version = "0.7", features = ["compat"] }
bb8 = "0.9"
bb8-tiberius = { version = "0.16", default-features = false, features = ["chrono", "tds73", "tokio", "tokio-util", "with-tokio", "tls"] }
rust_xlsxwriter = "0.99.1"
tauri-plugin-dialog = "2.8.1"
futures = "0.3.34"
csv = "1.4.0"
base64 = "0.22"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
