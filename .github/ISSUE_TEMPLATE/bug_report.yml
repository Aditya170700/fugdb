name: "🐛 Bug Report"
description: "Report a bug, crash, or unexpected behavior in FugDB."
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible to help us reproduce and resolve the problem quickly.
  - type: textarea
    id: description
    attributes:
      label: "Bug Description"
      description: "A clear and concise description of what the bug is."
      placeholder: "e.g., In-cell JSON editor fails to parse nested array when editing table users..."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to Reproduce"
      description: "List the exact steps to reproduce the behavior."
      placeholder: |
        1. Connect to PostgreSQL database
        2. Open table 'orders' in DataGrid
        3. Double-click on cell 'metadata'
        4. See error message in console...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "What did you expect to happen instead?"
      placeholder: "e.g., The JSON editor should update the cell value and stage the modification in the Staged Changes drawer."
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: "Operating System"
      description: "Which OS are you running FugDB on?"
      options:
        - "macOS (Apple Silicon / M-Series)"
        - "macOS (Intel)"
        - "Windows 11"
        - "Windows 10"
        - "Linux (Ubuntu / Debian)"
        - "Linux (Fedora / Arch / Other)"
    validations:
      required: true
  - type: dropdown
    id: db_engine
    attributes:
      label: "Database Engine & Version"
      description: "Which database engine were you connected to?"
      options:
        - "PostgreSQL (16 / 15 / 14 / earlier)"
        - "MySQL (8.0+ / 5.7)"
        - "MariaDB (10.x / 11.x)"
        - "SQLite 3"
        - "Microsoft SQL Server (MSSQL 2019/2022/Azure)"
        - "Redis / KeyDB"
        - "DuckDB"
        - "N/A (UI / General App Issue)"
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: "FugDB Version"
      placeholder: "e.g., v0.1.0 (from Title bar or Status bar)"
  - type: textarea
    id: logs
    attributes:
      label: "Error Logs / Screenshots"
      description: "Paste relevant console errors, terminal outputs, or drag-and-drop screenshots here. (Please sanitize any passwords or sensitive data!)"
      placeholder: "Paste console output or Rust backtrace here..."
